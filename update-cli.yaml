schemaVersion: 2
project:
  name: GitHub Runner CLI
  slug: github-runner-cli
  type: generic

defaults:
  timeout: 15m
  failFast: true

requirements:
  commands: [go]
  optionalCommands: [just, docker, gh]

run:
  description: Display CLI help (runner operations require an explicit repository)
  cwd: .
  command: ./dist/github-runner-cli --help

workflows:
  bootstrap:
    tasks: [bootstrap]
  setup:
    tasks: [bootstrap]
  precommit:
    tasks: [test]
  test:
    tasks: [test]
  build:
    tasks: [build]
  ci:
    tasks: [build]
  install:
    tasks: [install]
  run:
    tasks: [run]
  clean:
    tasks: [clean]

tasks:
  bootstrap:
    steps:
      - id: prepare-go-modules
        name: Prepare Go dependencies
        shell: just bootstrap
  test:
    requires: [bootstrap]
    steps:
      - id: go-ci
        name: Run Go format, vet and tests
        shell: just ci
  build:
    requires: [test]
    steps:
      - id: compile
        name: Compile Go CLI
        shell: just build
      - id: verify-binary
        name: Verify built binary exists
        assert:
          executable: dist/github-runner-cli
  install:
    requires: [build]
    steps:
      - id: install-cli
        name: Install binary and runtime assets
        shell: just install
  run:
    requires: [build]
    steps:
      - id: help
        name: CLI usage information
        shell: ./dist/github-runner-cli --help
  clean:
    steps:
      - id: generated-build-output
        name: Remove dist folder only
        shell: just clean

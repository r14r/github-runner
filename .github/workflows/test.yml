name: Go Runner CLI CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go formatting
        run: |
          gofmt -w ./cmd ./internal
          test -z "$(gofmt -l ./cmd ./internal)"
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test -race -count=1 ./...
      - name: Go CLI build and smoke test
        run: |
          go build -trimpath -ldflags "-X main.version=$(cat VERSION)" -o ./github-runner-cli ./cmd/github-runner-cli
          test "$(./github-runner-cli version)" = "github-runner-cli $(cat VERSION)"
          ./github-runner-cli --help

  bookbuilder-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build BookBuilder Docker image
        run: |
          docker build --platform linux/amd64 --target bookbuilder \
            -t github-actions-runner-ci:bookbuilder \
            -f runner/docker/Dockerfile runner/docker
      - name: Validate requirements in actual image
        run: |
          docker run --rm -i --platform linux/amd64 \
            --entrypoint bash github-actions-runner-ci:bookbuilder -s < doctor-linux.sh

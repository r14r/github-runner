name: Go Runner CLI CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check Go formatting (read-only)
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Go vet and race tests
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Install pinned just
        run: |
          curl -fsSL --retry 3 -o /tmp/just.tar.gz \
            https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' '4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d' /tmp/just.tar.gz | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/just"
          tar -xzf /tmp/just.tar.gz -C "$RUNNER_TEMP/just"
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
      - name: Build, CI and install generic CLI
        run: |
          just bootstrap
          just ci
          test -z "$(git status --porcelain -- cmd internal)"
          just build
          test -z "$(git status --porcelain -- cmd internal)"
          INSTALL_DIR="$RUNNER_TEMP/bin" just install
          test "$("$RUNNER_TEMP/bin/github-runner-cli" version)" = "github-runner-cli $(cat VERSION)"
          "$RUNNER_TEMP/bin/github-runner-cli" --help
          "$RUNNER_TEMP/bin/github-runner-cli" status --help | grep -q 'ghr status --repo'
          "$RUNNER_TEMP/bin/github-runner-cli" doctor --help | grep -q 'ghr doctor --repo'
          "$RUNNER_TEMP/bin/github-runner-cli" requirements --help | grep -q -- '--output PATH'
          test -f "$RUNNER_TEMP/bin/env/github-runner-cli/runner/docker/Dockerfile"
          test -f "$RUNNER_TEMP/bin/env/github-runner-cli/runner/docker/entrypoint.sh"
          test ! -e "$RUNNER_TEMP/bin/env/github-runner-cli/scripts"
      - name: Analyze this repository's workflows without executing code
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          "$RUNNER_TEMP/bin/github-runner-cli" requirements \
            --repo "$TARGET_REPOSITORY" --output "$RUNNER_TEMP/toolchain.yaml"
          grep -Fq "repository: \"$TARGET_REPOSITORY\"" "$RUNNER_TEMP/toolchain.yaml"
          grep -Fq 'name: "go"' "$RUNNER_TEMP/toolchain.yaml"
          grep -Fq 'actions/setup-go@v5' "$RUNNER_TEMP/toolchain.yaml"

  generic-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build repository-neutral toolchain image
        run: |
          docker build --platform linux/amd64 --target toolchain \
            --build-arg 'EXTRA_APT_PACKAGES=ffmpeg fontconfig' \
            --build-arg INSTALL_JUST=1 \
            --build-arg INSTALL_TYPST=1 \
            -t github-actions-runner-ci:generic \
            -f runner/docker/Dockerfile runner/docker
      - name: Verify real tools in generic image
        run: |
          docker run --rm --platform linux/amd64 --entrypoint bash \
            github-actions-runner-ci:generic -euc \
            'command -v ffmpeg; command -v fc-list; command -v just; command -v typst; just --version; typst --version'

name: Go Runner CLI CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go formatting
        run: |
          gofmt -w ./cmd ./internal
          test -z "$(gofmt -l ./cmd ./internal)"
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test -race -count=1 ./...
      - name: Install pinned just
        run: |
          curl -fsSL --retry 3 -o /tmp/just.tar.gz \
            https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' '4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d' /tmp/just.tar.gz | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/just"
          tar -xzf /tmp/just.tar.gz -C "$RUNNER_TEMP/just"
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
      - name: Run full just lifecycle (no Python)
        run: |
          just bootstrap
          just ci
          just build
          INSTALL_DIR="$RUNNER_TEMP/bin" just install
          test "$("$RUNNER_TEMP/bin/github-runner-cli" version)" = "github-runner-cli $(cat VERSION)"
          "$RUNNER_TEMP/bin/github-runner-cli" --help
          "$RUNNER_TEMP/bin/github-runner-cli" list-installed --help 2>/dev/null || true
          test -f "$RUNNER_TEMP/bin/env/github-runner-cli/runner/docker/Dockerfile"

  bookbuilder-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build BookBuilder Docker image
        run: |
          docker build --platform linux/amd64 --target bookbuilder \
            -t github-actions-runner-ci:bookbuilder \
            -f runner/docker/Dockerfile runner/docker
      - name: Validate requirements in actual image
        run: |
          docker run --rm -i --platform linux/amd64 \
            --entrypoint bash github-actions-runner-ci:bookbuilder -s < scripts/doctor-linux.sh

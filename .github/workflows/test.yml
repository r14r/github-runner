name: Runner management tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install regression test dependency
        run: python -m pip install pytest
      - name: Verify shell syntax
        run: |
          for script in ./*.sh; do bash -n "$script"; done
      - name: Run mocked runner tests
        run: python -m pytest -q tests

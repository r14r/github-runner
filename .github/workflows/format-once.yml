name: One-time Go formatting for refresh feature
on:
  push:
    branches:
      - feat/refresh-restart-idle-runner-v0.5.1
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/refresh-restart-idle-runner-v0.5.1
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Commit gofmt changes only
        run: |
          gofmt -w cmd/github-runner-cli/refresh.go cmd/github-runner-cli/refresh_test.go
          git diff --check
          if ! git diff --quiet -- cmd/github-runner-cli/refresh.go cmd/github-runner-cli/refresh_test.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- cmd/github-runner-cli/refresh.go cmd/github-runner-cli/refresh_test.go
            git commit -m "style: gofmt safe refresh feature"
            git push origin HEAD:feat/refresh-restart-idle-runner-v0.5.1
          fi

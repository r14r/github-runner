name: One-time Go source formatting for Actions CLI
on:
  push:
    branches:
      - feat/actions-run-management-v0.5.3
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/actions-run-management-v0.5.3
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format Go source and commit only changes
        run: |
          gofmt -w cmd/github-runner-cli/actions.go \
            cmd/github-runner-cli/actions_test.go \
            cmd/github-runner-cli/help.go \
            cmd/github-runner-cli/main.go
          git diff --check
          if ! git diff --quiet -- cmd/github-runner-cli; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- cmd/github-runner-cli/actions.go \
              cmd/github-runner-cli/actions_test.go \
              cmd/github-runner-cli/help.go \
              cmd/github-runner-cli/main.go
            git commit -m "style: gofmt Actions run management"
            git push origin HEAD:feat/actions-run-management-v0.5.3
          fi

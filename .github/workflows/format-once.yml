name: One-time compact doctor Go formatting
on:
  push:
    branches:
      - feat/doctor-compact-status-bom-v0.5.5
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/doctor-compact-status-bom-v0.5.5
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed Go files
        run: |
          gofmt -w cmd/github-runner-cli/full_doctor.go \
                   cmd/github-runner-cli/full_doctor_test.go \
                   cmd/github-runner-cli/runner_identity_bom_test.go \
                   cmd/github-runner-cli/manage.go \
                   cmd/github-runner-cli/main.go \
                   cmd/github-runner-cli/requirements.go
          git diff --check
          if ! git diff --quiet -- cmd/github-runner-cli; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd/github-runner-cli/full_doctor.go \
              cmd/github-runner-cli/full_doctor_test.go \
              cmd/github-runner-cli/runner_identity_bom_test.go \
              cmd/github-runner-cli/manage.go \
              cmd/github-runner-cli/main.go \
              cmd/github-runner-cli/requirements.go
            git commit -m "style: gofmt doctor v0.5.5"
            git push origin HEAD:feat/doctor-compact-status-bom-v0.5.5
          fi

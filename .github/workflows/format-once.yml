name: One-time format Go sources on refactor branch
on:
  push:
    branches:
      - refactor/repository-neutral-runner-v0.5.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.ref == 'refs/heads/refactor/repository-neutral-runner-v0.5.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/repository-neutral-runner-v0.5.0
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Normalize Go source once
        run: |
          gofmt -w ./cmd ./internal
          git diff --check
          if ! git diff --quiet -- cmd internal; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- cmd internal
            git commit -m "style: gofmt generic runner refactor"
            git push origin HEAD:refactor/repository-neutral-runner-v0.5.0
          fi

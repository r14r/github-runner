name: One-time format Go sources on migration branch
on:
  push:
    branches:
      - fix/ci-readonly-format-v0.3.3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.ref == 'refs/heads/fix/ci-readonly-format-v0.3.3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-readonly-format-v0.3.3
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Normalize Go formatting once on feature branch
        run: |
          gofmt -w ./cmd ./internal
          git diff --check
          if ! git diff --quiet -- cmd internal; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- cmd internal
            git commit -m "style: normalize all Go sources with gofmt"
            git push origin HEAD:fix/ci-readonly-format-v0.3.3
          fi

name: One-time gofmt for docker refresh routing
on:
  push:
    branches:
      - feat/refresh-restart-idle-runner-v0.5.1
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/refresh-restart-idle-runner-v0.5.1
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format Docker Go routing once
        run: |
          gofmt -w cmd/github-runner-cli/docker.go
          if ! git diff --quiet -- cmd/github-runner-cli/docker.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd/github-runner-cli/docker.go
            git commit -m "style: gofmt refresh routing"
            git push origin HEAD:feat/refresh-restart-idle-runner-v0.5.1
          fi
